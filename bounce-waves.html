<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bounce Waves · Marble Studio</title></head>
<body>
<header class="multiplier-header"><a class="brand" href="/">MARBLE STUDIO</a><nav><button id="studio-videos" class="button">My videos</button><button id="studio-export" class="button primary">Create video</button></nav></header>
<main class="multiplier-layout">
<aside class="multiplier-controls"><p class="eyebrow">BOUNCE WAVES</p><h1>A thousand bounces.<br><span>One perfect wave.</span></h1>
<label>Motion<select id="variant"><option value="ripple">Ripple bowl</option><option value="spiral">Spiral bloom</option><option value="cross">Cross waves</option><option value="petals">Flower pulse</option></select></label>
<fieldset class="palette-panel"><legend>Color gradients</legend><div id="palettes"></div></fieldset>
<div id="custom-colors" class="setting-row" hidden><label>First color<input id="colorA" type="color" value="#20dfff"></label><label>Last color<input id="colorB" type="color" value="#ff2458"></label></div>
<div class="setting-row"><label>Ball density<select id="count"><option value="800">Light · 800</option><option value="1400">Low · 1,400</option><option value="2200">Medium · 2,200</option><option value="2600">Medium · 2,600</option><option value="4200" selected>Dense · 4,200</option><option value="6000">Extra dense · 6,000</option><option value="8000">Maximum · 8,000</option></select></label><label>Duration<select id="duration"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="45">45 seconds</option><option value="60">60 seconds</option></select></label></div>
<div class="setting-row"><label>Wave height<input id="height" type="range" min="120" max="300" step="10" value="240"></label><label>Playback speed<select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div>
<details class="music-menu"><summary>Music</summary><label>Background music<select id="music-track"><option value="">No music</option></select></label><label>Music volume <output id="music-level">35%</output><input id="music-volume" type="range" min="0" max="100" value="35"></label><button id="music-preview" class="button" type="button">Preview music</button><p id="music-credit"></p><audio id="music-audio" loop preload="none"></audio></details>
<div class="actions"><button id="replay" class="button primary">Replay</button></div><p id="status" role="status" aria-live="polite"></p>
</aside>
<section class="multiplier-preview" aria-label="Animation preview"><div id="stage" class="multiplier-stage"><canvas id="waves-canvas" width="810" height="1440" aria-label="Colorful bouncing spheres form waves above a circular platform"></canvas></div><div class="playback"><button id="pause" class="button">Pause</button><button id="sound" class="button" aria-pressed="true">Sound on</button><button id="fullscreen" class="button">Full screen</button></div><p id="match-state" aria-live="off"></p></section>
</main><script type="module" src="/src/bounce-waves-app.js"></script></body></html>
